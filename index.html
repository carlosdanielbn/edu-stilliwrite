<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edu.stilliwrite.org</title>

<link rel="stylesheet" href="styles.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="nav">
  <div class="logo">✦ edu.stilliwrite</div>

  <nav>
    <a href="#grades" data-i18n="nav_grades"></a>
    <a href="#subjects" data-i18n="nav_subjects"></a>
    <a href="#accessibility" data-i18n="nav_accessibility"></a>
  </nav>

  <div class="lang">
    <button onclick="setLang('en')">EN</button>
    <button onclick="setLang('es')">ES</button>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1 data-i18n="hero_title"></h1>
    <p data-i18n="hero_subtitle"></p>
  </div>
</section>

<section class="section" id="grades">
  <h2 data-i18n="grades_title"></h2>

  <div class="grid">

    <div class="card">K</div>
    <div class="card">1</div>
    <div class="card">2</div>
    <div class="card">3</div>
    <div class="card">4</div>
    <div class="card">5</div>

  </div>
</section>

<section class="section" id="subjects">
  <h2 data-i18n="subjects_title"></h2>

  <div class="grid">
    <div class="card">Math</div>
    <div class="card">Science</div>
    <div class="card">English</div>
    <div class="card">History</div>
    <div class="card">Geography</div>
    <div class="card">Civics</div>
  </div>
</section>

<section class="section" id="accessibility">
  <h2 data-i18n="access_title"></h2>

  <div class="access">
    <button onclick="toggleContrast()">Contrast</button>
    <button onclick="toggleMotion()">Reduce Motion</button>
    <button onclick="increaseText()">A+</button>
    <button onclick="decreaseText()">A-</button>
  </div>
</section>

<script src="i18n.js"></script>
<script src="app.js"></script>

</body>
</html>
